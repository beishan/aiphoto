services:
  frontend:
    build: ./frontend
    container_name: memoryvault-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: memoryvault-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/memoryvault
      - SPRING_DATASOURCE_USERNAME=memoryvault
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-memoryvault}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_MODEL_ROOT=/models
      - STORAGE_PHOTOS_DIR=/data/photos
      - STORAGE_THUMBS_DIR=/data/thumbs
      - JWT_SECRET=${JWT_SECRET:-lDW0/F18wQVhRXMDuICETossPbtVaJ0qbJTWAwdNPE/OkzbNvYaXyf+OtD1dShLq}
    volumes:
      - ${AI_MODELS_PATH:-./ai-models}:/models
      - ${STORAGE_DATA:-./data/storage}:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: memoryvault-ai
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      # All models are externally managed and shared with the backend settings API.
      - ${AI_MODELS_PATH:-./ai-models}:/models
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    environment:
      - AI_MODEL_ROOT=/models
      # CPU/Docker Desktop defaults to one resident model to avoid memory exhaustion.
      # Set this to 3 on a NAS with sufficient NVIDIA GPU memory.
      - AI_MAX_LOADED_MODELS=${AI_MAX_LOADED_MODELS:-1}
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    restart: unless-stopped

  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: memoryvault-postgres
    environment:
      - POSTGRES_DB=memoryvault
      - POSTGRES_USER=memoryvault
      - POSTGRES_PASSWORD=${DB_PASSWORD:-memoryvault}
    volumes:
      - ${POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    shm_size: 256m
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryvault -d memoryvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
