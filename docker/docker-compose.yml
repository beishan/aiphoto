x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  postgres:
    image: aiphoto-postgres:pg16
    build:
      context: ../backend
      dockerfile: ../docker/postgres.Dockerfile
      labels:
        com.aiphoto.managed: "true"
    container_name: aiphoto-postgres
    restart: unless-stopped
    environment:
      # 保留原数据库和用户标识，以便直接复用 NAS 上已有数据。
      POSTGRES_DB: memoryvault
      POSTGRES_USER: memoryvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?please configure DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryvault -d memoryvault"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks: [aiphoto-network]

  ai-service:
    image: ${AI_IMAGE:-aiphoto-ai:0.2.2}
    build:
      context: ../ai-service
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      labels:
        com.aiphoto.managed: "true"
    container_name: aiphoto-ai
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      TZ: ${TZ:-Asia/Shanghai}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      AI_MODEL_ROOT: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${AI_MODELS_PATH:?please configure AI_MODELS_PATH}
        target: /models
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *default-logging
    networks: [aiphoto-network]

  backend:
    image: ${BACKEND_IMAGE:-aiphoto-backend:0.2.2}
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      labels:
        com.aiphoto.managed: "true"
    container_name: aiphoto-backend
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memoryvault
      SPRING_DATASOURCE_USERNAME: memoryvault
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      AI_MODEL_ROOT: /models
      STORAGE_PHOTOS_DIR: /data/photos
      STORAGE_THUMBS_DIR: /data/thumbs
      JWT_SECRET: ${JWT_SECRET:?please configure JWT_SECRET}
    ports:
      - "${BACKEND_PORT:-8392}:8080"
    volumes:
      - type: bind
        source: ${PHOTO_LIBRARY_PATH:?please configure PHOTO_LIBRARY_PATH}
        target: /photos
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AI_MODELS_PATH:?please configure AI_MODELS_PATH}
        target: /models
        bind:
          create_host_path: false
      - type: bind
        source: ${STORAGE_DATA_PATH:?please configure STORAGE_DATA_PATH}
        target: /data
        bind:
          create_host_path: false
    depends_on:
      postgres: {condition: service_healthy}
      ai-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    logging: *default-logging
    networks: [aiphoto-network]

  frontend:
    image: ${FRONTEND_IMAGE:-aiphoto-frontend:0.2.2}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      labels:
        com.aiphoto.managed: "true"
    container_name: aiphoto-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8391}:80"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    logging: *default-logging
    networks: [aiphoto-network]

volumes:
  # 沿用原命名卷，避免品牌升级时创建空数据库。
  postgres_data: {name: memoryvault-postgres-data}
  backups_data: {name: aiphoto-backups}
  deploy_state: {name: aiphoto-deploy-state}

networks:
  aiphoto-network:
    name: aiphoto-network
    driver: bridge
