server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memoryvault}
    username: ${SPRING_DATASOURCE_USERNAME:memoryvault}
    password: ${SPRING_DATASOURCE_PASSWORD:memoryvault}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      retry-attempts: 3

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  servlet:
    multipart:
      max-file-size: ${MODEL_UPLOAD_MAX_SIZE:8GB}
      max-request-size: ${MODEL_UPLOAD_MAX_SIZE:8GB}

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  ai-model-root: ${AI_MODEL_ROOT:/models}
  storage:
    photos-dir: ${STORAGE_PHOTOS_DIR:./data/photos}
    thumbs-dir: ${STORAGE_THUMBS_DIR:./data/thumbs}
  jwt:
    secret: ${JWT_SECRET:zyuaaRF5NrCVNn6ubybATQ3/Oeik70oNSsflUKKgF/Q=}
    expiration: 86400000  # 24 hours

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
