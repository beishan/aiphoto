const previewSlides = (items, current, image) => [-1,0,1].map(offset=>{
  const item=items[current+offset];
  return item===undefined?'':'<div class="preview-slide" data-page="'+offset+'" style="--page:'+offset+'">'+image(item,offset!==0)+'</div>';
}).join('');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function animateTransform(element, from, to, duration) {
  return element.animate(
    [{transform:from},{transform:to}],
    {duration:reduceMotion.matches?0:duration,easing:'cubic-bezier(.2,.75,.25,1)',fill:'forwards'},
  );
}
const slideX = distance => 'translate3d('+distance+'px,0,0)';
const adjacentSlide = (frame, direction) => frame.querySelector('[data-page="'+direction+'"]');
async function settlePreviewSlide(frame, distance, direction, changePhoto) {
  const track=frame.querySelector('.preview-track');
  const target=direction?-(frame.clientWidth+12)*direction:0;
  const animation=animateTransform(track,slideX(distance),slideX(target),220);
  try {
    await animation.finished;
    if(frame.isConnected && direction)changePhoto(direction);
  } finally {
    track.style.transform='';
    animation.cancel();
  }
}

function changePhoto(step){
  const list=[...pending];

function apply(action){
  const current=view==='preview';
  const ids=current?[index]:[...selected];
  if(!ids.length)return;
  const before=[...pending];
  ids.forEach(i=>pending.delete(i));
  if(action===0){
    ids.forEach(i=>importing.add(i));
    message='';

      ids.forEach(i=>importing.delete(i));

    },2200);

  else if('select' in d){view='selection';selected.clear();render();}
  else if('all' in d){pending.forEach(i=>selected.add(i));render();}

    const i=Number(d.photo);
    message='';

  }
  else if('action' in d)request(Number(d.action));

});

    await settlePreviewSlide(frame,distance,direction,changePhoto);
  } finally {
    if(settlingFrame===frame)settlingFrame=null;
  }
}
async function throwPreview(frame, x, y, action) {
  const current=frame.querySelector('[data-page="0"]');
  const underlay=frame.querySelector('.preview-underlay');
  const direction=Math.sign(y);
  const height=frame.clientHeight;
  settlingFrame=frame;
  const animation=animateTransform(current,throwTransform(x,y,height),
    action===null?'none':throwTransform(x+direction*frame.clientWidth*.16,direction*height*1.2,height),
    action===null?160:220);
  try {
    await animation.finished;
    if(frame.isConnected && action!==null)request(action);
  } finally {
    current.style.transform='';
    if(underlay){underlay.style.opacity='';underlay.style.transform='';}
    animation.cancel();
    if(settlingFrame===frame)settlingFrame=null;
  }
}
root.addEventListener('pointerdown',event=>{
  if(!event.isPrimary || event.button!==0)return;
  const tile=event.target.closest('.thumb');
  if(tile && view==='gallery'){
    longPress=setTimeout(()=>{view='selection';selected.add(Number(tile.dataset.photo));render();},480);
  }
  const frame=event.target.closest('.capture-frame');
  if(!frame || settlingFrame?.isConnected)return;
  const bounds=frame.getBoundingClientRect();
  if(event.clientX-bounds.left<20 || bounds.right-event.clientX<20)return;
  drag={frame,id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,dy:0,axis:null};
  frame.setPointerCapture(event.pointerId);
});
root.addEventListener('pointermove',event=>{
  if(!drag || drag.id!==event.pointerId)return;
  const {frame}=drag;
  const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
  if(!drag.axis && Math.hypot(dx,dy)>8)drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  if(drag.axis==='x'){
    const adjacent=adjacentSlide(frame,dx<0?1:-1);
    drag.dx=adjacent?dx:dx*.22;
    frame.querySelector('.preview-track').style.transform=slideX(drag.dx);
  } else if(drag.axis==='y'){
    drag.dx=dx*.38;
    drag.dy=dy;
    frame.querySelector('[data-page="0"]').style.transform=throwTransform(drag.dx,dy,frame.clientHeight);
    const underlay=frame.querySelector('.preview-underlay');
    if(underlay){
      const reveal=Math.min(1,Math.abs(dy)/frame.clientHeight*2.5);
      underlay.style.opacity=reveal;
      underlay.style.transform='scale('+(.94+.06*reveal)+')';
    }
  }
});
function finishPreviewDrag(event, cancelled=false) {
  clearTimeout(longPress);
  if(!drag || drag.id!==event.pointerId)return;
  const {frame,dx,dy,axis}=drag;
  drag=null;
  if(!frame.isConnected)return;
  if(axis==='x'){
    const direction=dx<0?1:-1;
    const commit=!cancelled && Math.abs(dx)>45 && adjacentSlide(frame,direction);
    void slidePreview(frame,dx,commit?direction:0);
  } else if(axis==='y') {
    void throwPreview(frame,dx,dy,!cancelled && Math.abs(dy)>=64?(dy<0?0:3):null);
  }
}
root.addEventListener('pointercancel',event=>finishPreviewDrag(event,true));
root.addEventListener('pointerup',event=>finishPreviewDrag(event));
render();

});

      {transform:'translate(-50%,-50%) translate('+direction*3+'px,-108px) rotate('+direction*-4+'deg) scale(1.24)',opacity:.48,offset:.65},
      {transform:'translate(-50%,-50%) translate('+direction*14+'px,-156px) rotate('+direction*-16+'deg) scale(1.24)',opacity:0}
    ],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:1050}).finished.then(()=>thumb.remove());
  }

    clearPendingTap();

    } else if(axis==='x'){
      const direction=distance<0?1:-1;
      const commit=!cancelled && Math.abs(distance)>45 && adjacentSlide(frame,direction);
      viewerSettling=frame;
      void settlePreviewSlide(frame,distance,commit?direction:0,showViewerPhoto).finally(()=>{
        if(viewerSettling===frame)viewerSettling=null;
      });
    }
  }

  let stripDrag = null;
  screen.addEventListener('scroll',event=>{
    if(event.target.matches('.photo-scroll'))updateGalleryHeader(event.target);
  },{capture:true,passive:true});
  screen.addEventListener('pointerdown',event=>{
    const frame=event.target.closest('.viewer-frame');
    if(frame && event.isPrimary && event.button===0 && !viewerSettling?.isConnected){
      viewerDrag={frame,id:event.pointerId,x:event.clientX,y:event.clientY,axis:null,distance:0};
      frame.setPointerCapture(event.pointerId);
    }
    const strip=event.target.closest('.media-strip');
    if(!strip||event.pointerType!=='mouse'||event.button!==0)return;
    stripDrag={strip,start:event.clientX,offset:strip.scrollLeft,moved:false};
  });
  screen.addEventListener('pointermove',event=>{
    if(viewerDrag?.id===event.pointerId){
      const {frame}=viewerDrag;
      const dx=event.clientX-viewerDrag.x,dy=event.clientY-viewerDrag.y;
      if(!viewerDrag.axis && Math.hypot(dx,dy)>8){
        clearPendingTap();
        viewerDrag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      }
      if(viewerDrag.axis==='x'){
        viewerDrag.distance=adjacentSlide(frame,dx<0?1:-1)?dx:dx*.22;
        frame.querySelector('.preview-track').style.transform=slideX(viewerDrag.distance);
      }
    }
    if(!stripDrag)return;
    if(!(event.buttons&1)){finishStripDrag();return;}
    const {strip,start,offset}=stripDrag;
    const distance=event.clientX-start;
    if(!stripDrag.moved&&Math.abs(distance)<5)return;
    if(!stripDrag.moved){
      stripDrag.moved=true;
      strip.classList.add('dragging');
      strip.setPointerCapture(event.pointerId);
    }
    strip.scrollLeft=offset-distance;
  });
  function finishStripDrag(){
    if(!stripDrag)return;
    stripDrag.strip.classList.remove('dragging');
    stripDrag=null;
  }
  screen.addEventListener('pointerup',event=>{finishViewerDrag(event);finishStripDrag();});
  screen.addEventListener('pointercancel',event=>{finishViewerDrag(event,true);finishStripDrag();});
  screen.addEventListener('dragstart',event=>{
    if(event.target.closest('.media-strip'))event.preventDefault();
  });

  screen.addEventListener('click',event=>{
    const control=event.target.closest('button');
    if(!control)return;
    const {go:id,photo:index,person:name,action:command}=control.dataset;
    if(index!==undefined)photo=Number(index);
    if(name!==undefined){personName=name;personParent=view;}
    if(id){
      if(id==='viewer' && view!=='photo-detail'){
        viewerParent=view;
        const ids=[...app.querySelectorAll('.gallery [data-go="viewer"]')].map(button=>Number(button.dataset.photo));
        viewerPhotos=ids.length?ids:allViewerPhotos();
      }
      if(id==='video')videoParent=view;
      if(id==='favorites'&&view!=='viewer')favoritesParent=view;
      show(id);return;
    }
    if(!command)return;
    clearPendingTap();
    notice='';
    switch(command){
      case 'favorite': if(favorites.has(photo))favorites.delete(photo);else favorites.add(photo);break;
      case 'viewer-like': {
        const frame=app.querySelector('.viewer-frame');
        const imageBox=frame.getBoundingClientRect(), hit=control.getBoundingClientRect();
        likeAt(frame,hit.left+hit.width/2-imageBox.left,hit.top+hit.height/2-imageBox.top,false);
        return;
      }
      case 'viewer-more': viewerDialog='menu';break;
      case 'viewer-trash': viewerDialog='trash';break;
      case 'viewer-dismiss': viewerDialog=null;break;
      case 'viewer-delete': {
        const position=viewerPhotos.indexOf(photo);
        deletedPhotos.add(photo);
        favorites.delete(photo);
        likeCounts.delete(photo);
        viewerPhotos=viewerPhotos.filter(id=>id!==photo);
        viewerDialog=null;
        if(!viewerPhotos.length){show(viewerParent);return;}
        photo=viewerPhotos[Math.min(position,viewerPhotos.length-1)];
        break;
      }
      case 'restore': restored=true;notice='已恢复 1 张照片';break;
      case 'cache': cache='0 MB';notice='已清理缓存';break;
      case 'download': download=download==='进行中'?'已取消':download==='已取消'?'进行中':'已完成';break;
    }
    render();
  });
  screen.addEventListener('keydown',event=>{
    if(event.key==='Escape' && view==='viewer' && likeMode){
      exitLikeMode();
    }
  });
  screen.addEventListener('submit',event=>{
    event.preventDefault();
    const form=event.target;
    const data=new FormData(form);
    switch(form.dataset.form){
      case 'connect':show('login');break;
      case 'login':show('photos');break;
      case 'search':search=String(data.get('query')).trim();render();break;
      case 'filters':notice='已应用筛选';show('search',true);break;
      case 'album':
        createdAlbum=String(data.get('name')).trim();
        if(createdAlbum)show('album');else{notice='请填写相册名称';render();}
        break;
      case 'metadata':
        renamed=String(data.get('name')).trim()||renamed;
        rating=Math.min(5,Math.max(0,Number(data.get('rating'))));
        notice='已保存';render();break;
    }
  });
  screen.addEventListener('change',event=>{
    if(event.target.name!=='theme')return;
    theme=event.target.value;
    const scheme=theme==='深色'?'dark':theme==='浅色'?'light':'light dark';
    screen.style.colorScheme=scheme;
    capture.style.colorScheme=scheme;
  });
  picker.addEventListener('change',()=>{
    if(picker.value==='viewer')viewerPhotos=allViewerPhotos();
    show(picker.value);
  });
  capture.addEventListener('capture-exit',()=>show(lastDesign));
  capture.addEventListener('capture-view',event=>{if(!capture.hidden)picker.value=event.detail;});
  show(location.hash.slice(1)||'photos');
})();
</script>

</html>
